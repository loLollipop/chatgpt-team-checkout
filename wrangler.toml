name = "chatgpt-team-checkout"
main = "src/worker.js"
compatibility_date = "2024-12-01"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["*/15 * * * *"]

# 首次部署前运行 `npx wrangler d1 create chatgpt-team-checkout-db`，
# 然后用命令输出的真实 ID 替换下面的占位值。
[[d1_databases]]
binding = "DB"
database_name = "chatgpt-team-checkout-db"
database_id = "4c0f9b30-4421-49e4-b093-c1948ebd2bcf"
migrations_dir = "migrations"
